name: Publish release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version from custom_components/todo_sync/manifest.json (without v)"
        required: true
        type: string
      release_sha:
        description: "Merge commit SHA on main to tag and release"
        required: true
        type: string

# The built-in token only needs to check out the selected commit.
permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'automation/release-v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_sha }}
          fetch-depth: 0

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: qu4nd
          repositories: ha-todo-sync
          permission-contents: write

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || inputs.release_sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/todo_sync/manifest.json", encoding="utf-8"))["version"])')"
          tag="v${version}"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            expected_branch="automation/release-${tag}"
            if [[ "$HEAD_BRANCH" != "$expected_branch" ]]; then
              echo "Unexpected release branch: $HEAD_BRANCH (expected $expected_branch)"
              exit 1
            fi
          else
            if [[ "$version" != "$INPUT_VERSION" ]]; then
              echo "Manifest version $version does not match requested version $INPUT_VERSION"
              exit 1
            fi

            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "$MERGE_SHA" FETCH_HEAD; then
              echo "Selected commit is not contained in main."
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; will ensure the integration ZIP is attached."
          else
            # Generate notes explicitly, then validate them before publishing.
            gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" \
              -f target_commitish="$MERGE_SHA" \
              --jq .body > generated-notes.md

            python - <<'PY'
          from pathlib import Path

          path = Path("generated-notes.md")
          notes = path.read_text(encoding="utf-8").strip()
          lines = notes.splitlines()

          # Guard against the exact duplicate-body failure seen in v0.1.18.
          if len(lines) % 2 == 0:
              midpoint = len(lines) // 2
              if lines[:midpoint] == lines[midpoint:]:
                  lines = lines[:midpoint]
                  notes = "\\n".join(lines).strip()
                  print("Removed an identical duplicated release-notes block.")

          if not notes:
              raise SystemExit("Generated release notes are empty; refusing to publish.")

          if notes.count("## What's Changed") > 1:
              raise SystemExit(
                  "Generated release notes contain multiple What's Changed sections; "
                  "refusing to publish potentially duplicated notes."
              )

          path.write_text(notes + "\\n", encoding="utf-8")
          PY

            gh release create "$tag" \
              --target "$MERGE_SHA" \
              --title "$tag" \
              --notes-file generated-notes.md
          fi

          # Keep asset publication in this workflow to avoid a tag-triggered race.
          cd custom_components/todo_sync
          zip -r ../../todo_sync.zip .
          cd ../..
          gh release upload "$tag" todo_sync.zip --clobber
