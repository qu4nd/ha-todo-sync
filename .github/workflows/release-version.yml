name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increase
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump manifest version
        id: version
        env:
          BUMP: \${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("custom_components/todo_sync/manifest.json")
          content = path.read_text(encoding="utf-8")
          match = re.search(
              r'(?m)^([ \t]*"version"[ \t]*:[ \t]*")([0-9]+)\.([0-9]+)\.([0-9]+)(")',
              content,
          )
          if not match:
              raise SystemExit("Could not find a semantic version in manifest.json")

          major, minor, patch = map(int, match.group(2, 3, 4))
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported version bump: {bump}")

          version = f"{major}.{minor}.{patch}"
          updated = (
              content[:match.start()]
              + match.group(1)
              + version
              + match.group(5)
              + content[match.end():]
          )
          json.loads(updated)
          path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_version={version}\n")
          print(f"Prepared version {version}")
          PY

      - name: Create version bump pull request
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          VERSION: \${{ steps.version.outputs.new_version }}
        run: |
          branch="automation/release-v\${VERSION}"
          title="chore: prepare release v\${VERSION}"
          body="$(cat <<EOF
          ## Release preparation

          - Bump \`custom_components/todo_sync/manifest.json\` to **\${VERSION}**
          - No functional code changes

          After merging this PR, create the GitHub release with the matching tag:
          \`v\${VERSION}\`

          The normal pull-request checks run automatically.
          EOF
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add custom_components/todo_sync/manifest.json
          git commit -m "chore: bump version to v\${VERSION}"
          git push --force origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
