name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increase
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump manifest version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("custom_components/todo_sync/manifest.json")
          content = path.read_text(encoding="utf-8")
          match = re.search(
              r'(?m)^([ \\t]*"version"[ \\t]*:[ \\t]*")([0-9]+)\\.([0-9]+)\\.([0-9]+)(")',
              content,
          )
          if not match:
              raise SystemExit("Could not find a semantic version in manifest.json")

          major, minor, patch = map(int, match.group(2, 3, 4))
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported version bump: {bump}")

          version = f"{major}.{minor}.{patch}"
          updated = (
              content[:match.start()]
              + match.group(1)
              + version
              + match.group(5)
              + content[match.end():]
          )
          json.loads(updated)
          path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_version={version}\\n")
          print(f"Prepared version {version}")
          PY

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/release-v${{ steps.version.outputs.new_version }}
          delete-branch: true
          commit-message: "chore: bump version to v${{ steps.version.outputs.new_version }}"
          title: "chore: prepare release v${{ steps.version.outputs.new_version }}"
          body: |
            ## Release preparation

            - Bump `custom_components/todo_sync/manifest.json` to **${{ steps.version.outputs.new_version }}**
            - No functional code changes

            After merging this PR, create the GitHub release with the matching tag:
            `v${{ steps.version.outputs.new_version }}`

            The normal pull-request checks run automatically.
