name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel to prepare
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable
      bump:
        description: Version component to increase (used for a new release target)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Calculate and write release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP: ${{ inputs.bump }}
        run: python scripts/release_version.py

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: qu4nd
          repositories: ha-todo-sync
          permission-contents: write
          permission-pull-requests: write

      - name: Create version bump pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          branch="automation/release-v${VERSION}"
          title="chore: prepare ${RELEASE_TYPE} release v${VERSION}"
          body="$(cat <<EOF
          ## Release preparation

          - Bump custom_components/todo_sync/manifest.json to **${VERSION}**
          - Release channel: **${RELEASE_TYPE}**
          - No functional code changes

          Once all required validation checks pass, this PR is merged automatically.
          The Publish release workflow then creates the matching tag, GitHub release,
          release notes, and integration ZIP.
          EOF
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -C "$branch"
          git add custom_components/todo_sync/manifest.json
          git commit -m "chore: bump version to v${VERSION}"
          git push --force origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
