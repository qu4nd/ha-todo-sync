name: Version consistency

on:
  pull_request:
    paths:
      - "custom_components/todo_sync/manifest.json"
      - ".github/workflows/version-check.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate manifest version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/todo_sync/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest.get("version")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("manifest.json must contain a non-empty string version")

          print(f"Manifest version: {version}")
          PY
