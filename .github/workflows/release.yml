name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest version against release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/todo_sync/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest.get("version")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("manifest.json must contain a non-empty string version")

          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match manifest version {version!r}; "
                  f"expected {expected!r}"
              )

          print(f"Validated release version: {version}")
          PY

      - name: Zip integration
        run: cd custom_components/todo_sync && zip -r ../../todo_sync.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: To-do Sync ${{ github.ref_name }}
          files: todo_sync.zip
          generate_release_notes: true
