name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

# Third-party actions are pinned to SHAs of releases with a Node.js 24 runtime.
# Re-check action.yml when updating these pins.
# The validation jobs check out the exact PR head without credentials and receive no secrets.
# The privileged merge job never checks out or executes PR code.
permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-hacs-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Decide whether HACS validation is needed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Always validate pushes to main, scheduled runs, and manual runs.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HACS checks repository/integration metadata, not Python implementation
          # or tests. Keep this list aligned with the files that affect those checks.
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          run_hacs=false
          while IFS= read -r file; do
            case "$file" in
              README*|hacs.json|custom_components/todo_sync/manifest.json|custom_components/todo_sync/brand/*)
                run_hacs=true
                break
                ;;
            esac
          done <<< "$files"

          echo "run=$run_hacs" >> "$GITHUB_OUTPUT"
          echo "HACS validation required: $run_hacs"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    needs: detect-hacs-changes
    if: needs.detect-hacs-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install test dependencies
        run: uv pip install --system -r requirements_test.txt
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate manifest version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/todo_sync/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest.get("version")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("manifest.json must contain a non-empty string version")

          print(f"Manifest version: {version}")
          PY

  auto-merge-release:
    needs:
      - hassfest
      - hacs
      - tests
      - check-version
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/release-v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # This job intentionally does not check out the PR branch or execute its code.
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: qu4nd
          repositories: ha-todo-sync
          permission-contents: write
          permission-pull-requests: write

      - name: Verify release PR and merge it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author_type="$(jq -r '.user.type' <<< "$pr")"
          base_branch="$(jq -r '.base.ref' <<< "$pr")"
          head_branch="$(jq -r '.head.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
          is_draft="$(jq -r '.draft' <<< "$pr")"
          merged="$(jq -r '.merged' <<< "$pr")"

          if [[ "$author_type" != "Bot" ||
                "$base_branch" != "main" ||
                "$head_repo" != "$REPOSITORY" ||
                ! "$head_branch" =~ ^automation/release-v[0-9]+\.[0-9]+\.[0-9]+$ ||
                "$pr_head_sha" != "$HEAD_SHA" ||
                "$is_draft" == "true" ||
                "$merged" == "true" ]]; then
            echo "Release PR metadata did not pass validation; refusing to merge."
            exit 1
          fi

          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          expected_file="custom_components/todo_sync/manifest.json"
          if [[ "$files" != "$expected_file" ]]; then
            echo "Unexpected files in automated release PR:"
            printf '%s\n' "$files"
            exit 1
          fi

          echo "All validation jobs passed and PR contents are restricted to the manifest version bump."
          result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")"
          if [[ "$(jq -r '.merged' <<< "$result")" != "true" ]]; then
            echo "GitHub did not confirm that PR #$PR_NUMBER was merged."
            printf '%s\n' "$result"
            exit 1
          fi

          echo "Release PR #$PR_NUMBER merged successfully."
