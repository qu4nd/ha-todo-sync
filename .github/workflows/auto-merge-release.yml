name: Auto-merge release PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: auto-merge-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'automation/release-v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected='["tests","hassfest","hacs"]'
          for attempt in {1..40}; do
            checks="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs" --jq '[.check_runs[] | select(.name == "tests" or .name == "hassfest" or .name == "hacs")]')"
            count="$(jq 'length' <<< "$checks")"

            if [[ "$count" -eq 3 ]]; then
              failed="$(jq -r '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$checks")"
              if [[ "$failed" -gt 0 ]]; then
                echo "At least one release validation check failed:"
                jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "\(.name): \(.conclusion)"' <<< "$checks"
                exit 1
              fi

              pending="$(jq -r '[.[] | select(.status != "completed" or .conclusion != "success")] | length' <<< "$checks")"
              if [[ "$pending" -eq 0 ]]; then
                echo "All release validation checks passed for $HEAD_SHA."
                exit 0
              fi
            fi

            echo "Waiting for release validation checks ($attempt/40; found $count/3)."
            sleep 15
          done

          echo "Timed out waiting for release validation checks."
          exit 1

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: qu4nd
          repositories: ha-todo-sync
          permission-contents: write
          permission-pull-requests: write

      - name: Verify release PR and merge it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr")"
          base_branch="$(jq -r '.base.ref' <<< "$pr")"
          head_branch="$(jq -r '.head.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
          is_draft="$(jq -r '.draft' <<< "$pr")"
          merged="$(jq -r '.merged' <<< "$pr")"

          if [[ "$author" != "github-actions[bot]" ||
                "$base_branch" != "main" ||
                "$head_repo" != "$REPOSITORY" ||
                ! "$head_branch" =~ ^automation/release-v[0-9]+\.[0-9]+\.[0-9]+$ ||
                "$pr_head_sha" != "$HEAD_SHA" ||
                "$is_draft" == "true" ||
                "$merged" == "true" ]]; then
            echo "Release PR metadata did not pass validation; refusing to merge."
            printf 'author=%s base=%s head=%s repo=%s sha=%s draft=%s merged=%s\n' \
              "$author" "$base_branch" "$head_branch" "$head_repo" "$pr_head_sha" "$is_draft" "$merged"
            exit 1
          fi

          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          expected_file="custom_components/todo_sync/manifest.json"
          if [[ "$files" != "$expected_file" ]]; then
            echo "Unexpected files in automated release PR:"
            printf '%s\n' "$files"
            exit 1
          fi

          echo "Validation passed and PR contents are restricted to the manifest version bump."
          echo "Merging release PR #$PR_NUMBER."
          result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")"
          if [[ "$(jq -r '.merged' <<< "$result")" != "true" ]]; then
            echo "GitHub did not confirm that PR #$PR_NUMBER was merged."
            printf '%s\n' "$result"
            exit 1
          fi

          echo "Release PR #$PR_NUMBER merged successfully."
